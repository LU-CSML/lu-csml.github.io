title: CSML
description: Lancaster University Computational Statistics and Machine Learning Seminar
baseurl: ""
url: "https://lu-csml.github.io"

# Seminar venue, shared by the home and schedule pages.
seminar:
  day: Thursdays
  time: "15:00–16:00 UK local time"
  venue: Charles Carter, A02
  venue_url: "https://use.mazemap.com/#v=1&config=lancaster&campusid=341&zlevel=1&center=-2.785419,54.007349&zoom=18&search=charle%20carter%20A02&sharepoitype=identifier&sharepoi=31439"

# Build settings
markdown: kramdown

# Keep development environments and tests out of the site and file watcher.
exclude:
  - .venv
  - .venv-wordcloud
  - vendor
  - tests
  - scripts/__pycache__

# Plugins
plugins:
  - jekyll-sitemap
