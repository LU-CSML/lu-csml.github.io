title: CSML
description: Lancaster University Computational Statistics and Machine Learning Seminar
baseurl: ""
url: "https://lu-csml.github.io"

# Seminar venue, shared by the home and schedule pages.
seminar:
  day: Thursdays
  time: "15:00–16:00 UK local time"
  venue: Charles Carter, A02
  venue_url: "https://www.google.com/maps/search/?api=1&query=54.007329,-2.785412"

# Build settings
markdown: kramdown

# Keep development environments and tests out of the site and file watcher.
exclude:
  - .venv
  - .venv-wordcloud
  - vendor
  - tests
  - scripts/__pycache__

# Plugins
plugins:
  - jekyll-sitemap
